services:
  - type: web
    name: ai-crypto-farmer
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    autoDeploy: true
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: PRIVATE_KEY
        sync: false
      - key: WALLET_ADDRESS
        sync: false
      - key: EXCHANGE_API_KEY
        sync: false
      - key: EXCHANGE_SECRET_KEY
        sync: false
      - key: MIN_OFFRAMP_USDC
        value: "10.0"
      - key: POLYGON_RPC_URL
        value: [https://polygon-rpc.com](https://polygon-rpc.com)
      - key: BASE_SEPOLIA_RPC_URL
        value: [https://sepolia.base.org](https://sepolia.base.org)
      - key: POLL_INTERVAL_HOURS
        value: "6"
      - key: AI_CONFIDENCE_THRESHOLD
        value: "0.75"
      - key: MAINNET_SWAP_ENABLED
        value: "false"